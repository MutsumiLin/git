server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: green-travel
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/green_travel?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USER:green_travel}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 12
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  seed-demo: ${SEED_DEMO:false}
  demo-password: ${DEMO_PASSWORD:GreenDemo!2026}
logging:
  level:
    root: INFO
